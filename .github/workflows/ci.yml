name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: typecheck · test · build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Valores dummy (não são segredos) — apenas destravam o build em
          # ambiente isolado. O build não faz chamadas autenticadas; as poucas
          # leituras em build time (generateStaticParams) degradam para vazio
          # quando o Supabase não é acessível.
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dummy-anon-key
          GEMINI_API_KEY: dummy-key
