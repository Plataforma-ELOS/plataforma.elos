# Faz o papel do gateway do Supabase: a app chama <url>/rest/v1/<tabela> e o
# PostgREST espera só /<tabela>. O log registra status e tempos de cada
# consulta — é ele que mostra quantas consultas chegaram ao banco para cada
# requisição do k6 (amplificação por retry).
log_format estresse '$time_iso8601 $status $request_time $upstream_response_time "$request_method $uri"';

server {
  listen 80;
  access_log /dev/stdout estresse;

  location /rest/v1/ {
    proxy_pass http://toxiproxy:3001/;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
  }

  # Sem GoTrue: o teste é de tráfego anônimo (sem sessão, o supabase-js não
  # chama /auth/v1). Responder 501 deixa explícito se algo tentar.
  location /auth/v1/ {
    return 501;
  }
}
